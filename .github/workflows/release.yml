name: release

# a pushed tag vX.Y.Z builds every target and publishes them, with
# checksums, as that tag's GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$crate" = "$TAG" ] || { echo "tag $TAG, crate $crate"; exit 1; }
      - name: Notes from the changelog
        run: |
          awk -v want="## [${TAG#v}]" '
            index($0, want) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no changelog section for $TAG"; exit 1; }
      - run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload
        run: |
          name="heeded-$TAG-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/heeded${{ matrix.exe }}" "$name"
          gh release upload "$TAG" "$name"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checksums
        run: |
          mkdir out && cd out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'heeded-*'
          sha256sum heeded-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY"
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
