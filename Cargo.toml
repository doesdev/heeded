[package]
name = "heeded"
version = "0.14.0"
edition = "2024"
description = "Workflow guardrails that get installed instead of remembered"
license = "MIT"
authors = ["Andrew Carpenter"]
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
